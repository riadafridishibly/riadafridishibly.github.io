# Site Build Settings

# Jekyll-paginate-v2 configuration
#  pagination:
#   enabled: true
#   per_page: 5
#   permalink: '/page/:num/'
#   title: ':title - page :num of :max'
#   limit: 0
#   sort_field: 'date'
#   sort_reverse: true

# jekyll-paginate configuration
paginate: 5
url: "https://riad.run"
lang: en-US

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title
plugins: [jekyll-paginate, jekyll-sitemap, jekyll-feed, jekyll-seo-tag]

sass:
  style: compressed

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
title: "random thoughts"
# Shown in the site header/footer and appended to the home page <title>
tagline: "a journey to somewhere"
# Used as the default <meta name="description"> for pages without their own
description: "Posts on Go, HTTP and networking, cryptography, Linux and developer tooling, written by Riad Afridi Shibly."
author:
  name: "Riad Afridi Shibly"
  twitter: afridishibly
  url: "https://riad.run/about"
# RSS 2.0 can be used instead of Atom by uncommenting following two lines
#feed:
#  path: rss-feed.xml

twitter:
  username: afridishibly
  card: summary_large_image

# Feeds schema.org "sameAs" links for the site author
social:
  name: "Riad Afridi Shibly"
  links:
    - https://github.com/riadafridishibly
    - https://twitter.com/afridishibly
    - https://www.linkedin.com/in/riadafridishibly/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true

exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - LICENSE.md
  - docker-compose.yml
  - lagrange.gemspec
  - .prettierignore
  - .ruby-version
  - codes
  - vendor
